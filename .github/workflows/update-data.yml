name: Update TQQQ price data

on:
  schedule:
    # 매일 22:30 UTC (미국 정규장 마감 이후, EDT/EST 모두 커버)
    # 백테스트 대시보드가 매일 갱신을 쓰고 있어 그대로 둔다.
    - cron: '30 22 * * *'
    # 매주 수요일 23:00 UTC — 모니터링용 주간 확정 갱신
    # (일간 job이 실패해 건너뛴 주가 있어도 최소 주 1회는 최신화되도록 이중화)
    - cron: '0 23 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest TQQQ / QQQ price data
        run: node scripts/update-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "tqqq-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data/tqqq.json src/data/qqq.json; then
            echo "No data changes."
            exit 0
          fi
          git add src/data/tqqq.json src/data/qqq.json
          git commit -m "data: TQQQ·QQQ 가격 데이터 자동 업데이트 $(date -u +%Y-%m-%d)"
          git push
