name: Update TQQQ price data

on:
  schedule:
    # 매일 22:30 UTC (미국 정규장 마감 이후, EDT/EST 모두 커버)
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest TQQQ price data
        run: node scripts/update-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "tqqq-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data/tqqq.json; then
            echo "No data changes."
            exit 0
          fi
          git add src/data/tqqq.json
          git commit -m "data: TQQQ 가격 데이터 자동 업데이트 $(date -u +%Y-%m-%d)"
          git push
